[workspace]
resolver = "2"
members = [
    "crates/preebs-core",
    "crates/preebs-cli",
    "crates/preebs-app/src-tauri",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.128"
thiserror = "=1.0.64"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
uuid = { version = "=1.11.0", features = ["v4"] }
chrono = { version = "=0.4.38", default-features = false, features = ["clock", "std"] }
clap = { version = "=4.5.21", features = ["derive"] }
dirs = "=5.0.1"

[profile.release]
lto = "thin"
strip = true
opt-level = "s"
