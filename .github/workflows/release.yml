name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  DEBIAN_FRONTEND: noninteractive

jobs:
  verify:
    name: version matches tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          python3 - "$VER" <<'PY'
          import json, pathlib, sys
          ver = sys.argv[1]
          cargo = pathlib.Path("Cargo.toml").read_text()
          block = cargo.split("[workspace.package]", 1)[1].split("[", 1)[0]
          if f'version = "{ver}"' not in block:
              raise SystemExit(f"Cargo.toml workspace.package version is not {ver}")
          conf = json.loads(pathlib.Path("crates/preebs-app/src-tauri/tauri.conf.json").read_text())
          if conf["version"] != ver:
              raise SystemExit(f"tauri.conf.json version is {conf['version']}, tag is {ver}")
          pkg = json.loads(pathlib.Path("crates/preebs-app/package.json").read_text())
          if pkg["version"] != ver:
              raise SystemExit(f"package.json version is {pkg['version']}, tag is {ver}")
          print(f"version {ver} matches")
          PY
          echo "version=$VER" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS ${{ matrix.asset }}
    needs: verify
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset: aarch64
          - target: x86_64-apple-darwin
            asset: x64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/preebs-app/package-lock.json
      - name: Frontend
        working-directory: crates/preebs-app
        run: npm ci
      - name: CLI and app
        run: |
          cargo build --release -p preebs-cli --target ${{ matrix.target }}
          bash crates/preebs-app/scripts/stage-cli.sh ${{ matrix.target }}
          cd crates/preebs-app
          npx tauri build --target ${{ matrix.target }} --bundles dmg
      - name: Collect artifacts
        run: |
          VER="${{ needs.verify.outputs.version }}"
          mkdir -p dist
          DMG="$(find target/${{ matrix.target }}/release/bundle/dmg -name '*.dmg' | head -n 1)"
          cp "$DMG" "dist/PreEBS_${VER}_${{ matrix.asset }}.dmg"
          cp "target/${{ matrix.target }}/release/preebs" "dist/preebs-macos-${{ matrix.asset }}"
          chmod +x "dist/preebs-macos-${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.asset }}
          path: dist/*

  linux:
    name: Linux
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/preebs-app/package-lock.json
      - name: WebKitGTK and AppImage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential pkg-config file
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64
      - name: Frontend
        working-directory: crates/preebs-app
        run: npm ci
      - name: CLI, deb, and AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          cargo build --release -p preebs-cli
          bash crates/preebs-app/scripts/stage-cli.sh
          cd crates/preebs-app
          npx tauri build --bundles deb,appimage
      - name: Collect artifacts
        run: |
          VER="${{ needs.verify.outputs.version }}"
          mkdir -p dist
          DEB="$(find target/release/bundle/deb -name '*.deb' | head -n 1)"
          APP="$(find target/release/bundle/appimage -name '*.AppImage' | head -n 1)"
          cp "$DEB" "dist/PreEBS_${VER}_amd64.deb"
          cp "$APP" "dist/PreEBS_${VER}_amd64.AppImage"
          cp target/release/preebs dist/preebs-linux-x86_64
          chmod +x dist/preebs-linux-x86_64 dist/PreEBS_${VER}_amd64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  publish:
    name: GitHub Release and Homebrew tap
    needs: [verify, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Extension zips
        run: |
          zip -r release/preebs-chrome.zip chrome-extension/preebs-ebs-importer
          zip -r release/preebs-firefox.zip firefox-extension/preebs-ebs-importer
          find release -type f -exec chmod a+r {} \;
          ls -l release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/* \
              --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
      - name: Check out the tap on the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tap
      - name: Update Homebrew cask
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          ARM="$(sha256sum "release/PreEBS_${VERSION}_aarch64.dmg" | awk '{print $1}')"
          INTEL="$(sha256sum "release/PreEBS_${VERSION}_x64.dmg" | awk '{print $1}')"
          mkdir -p tap/Casks
          export ARM INTEL VERSION
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = os.environ["VERSION"]
          arm = os.environ["ARM"]
          intel = os.environ["INTEL"]
          Path("tap/Casks/preebs.rb").write_text(f'''cask "preebs" do
            version "{version}"

            name "PreEBS"
            desc "Monday–Friday hours, exported for the EBS browser extensions"
            homepage "https://github.com/Bethamil/preEBS"

            on_arm do
              sha256 "{arm}"
              url "https://github.com/Bethamil/preEBS/releases/download/v#{{version}}/PreEBS_#{{version}}_aarch64.dmg"
            end
            on_intel do
              sha256 "{intel}"
              url "https://github.com/Bethamil/preEBS/releases/download/v#{{version}}/PreEBS_#{{version}}_x64.dmg"
            end

            depends_on macos: ">= :big_sur"

            app "PreEBS.app"
            binary "#{{appdir}}/PreEBS.app/Contents/MacOS/preebs-cli", target: "preebs"

            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-dr", "com.apple.quarantine", "#{{appdir}}/PreEBS.app"]
            end

            zap trash: [
              "~/Library/Application Support/PreEBS",
            ]
          end
          ''')
          PY
          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C tap add Casks/preebs.rb
          if ! git -C tap diff --cached --quiet; then
            git -C tap commit -m "chore: update Homebrew cask to ${VERSION}"
            git -C tap push origin "HEAD:${DEFAULT_BRANCH}"
          fi
